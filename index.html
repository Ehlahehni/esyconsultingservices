<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Colorful Scroll Overload</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #faf7f2;
      color: #111;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* Long track for scrolling distance */
    .scroll-container { height: 400vh; position: relative; }

    /* Locks the view in the viewport */
    .hero-viewport {
      position: sticky; top: 0;
      height: 100vh; width: 100vw;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    /* Standard canvas for the background meme (optional ink-boil filter) */
    #background-meme {
      position: absolute;
      width: 100%; max-width: 650px; height: auto; aspect-ratio: 1/1;
      filter: url(#ink-boil);
      z-index: 1; /* Behind 3D */
    }

    /* WebGL canvas for Three.js (3D symbols) */
    #three-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2; /* In front of 2D meme */
    }

    .scroll-hint {
      position: absolute; bottom: 2rem;
      font-size: 0.85rem; text-transform: uppercase;
      letter-spacing: 0.15em; font-weight: 600; color: #555;
      z-index: 3;
    }
  </style>
</head>
<body>

  <!-- SVG Filter for the background meme jitter (optional) -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
    <filter id="ink-boil">
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="scroll-container">
    <div class="hero-viewport">
      <!-- 2D Canvas for background image -->
      <canvas id="background-meme" width="700" height="700"></canvas>
      <!-- WebGL Canvas for Three.js -->
      <canvas id="three-canvas"></canvas>
      <div class="scroll-hint">Scroll down to overload</div>
    </div>
  </div>

  <!-- Include Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    /* --- 1. SETTING UP THE TWO CANVASES --- */

    // 1A. Background 2D Meme
    const bgCanvas = document.getElementById("background-meme");
    const bgCtx = bgCanvas.getContext("2d");
    const turbulence = document.getElementById("turbulence");
    const memeImg = new Image();
    memeImg.src = "Snipaste_2026-09-04_03-21-35.png"; // <-- Replace with your image filename

    // 1B. Three.js 3D Scene
    const threeCanvas = document.getElementById("three-canvas");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // 1C. Handle Resize
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });

    /* --- 2. THE 3D SYMBOL SYSTEM (Explosion) --- */

    const symbolsData = [
      { text: "π", color: 0x3ac1ef }, // Blue
      { text: "∫", color: 0xff6b6b }, // Red
      { text: "∑", color: 0x4caf50 }, // Green
      { text: "{ }", color: 0xf5a623 }, // Orange
      { text: "≠", color: 0x9c27b0 }, // Purple
      { text: "01", color: 0xffeb3b }, // Yellow
      { text: "∞", color: 0x3ac1ef }
    ];

    const symbolGroup = new THREE.Group();
    scene.add(symbolGroup);

    // Create 3D 'planes' using rendered canvas text as texture
    symbolsData.forEach((data, index) => {
      // 1. Create a texture by drawing text on a temporary canvas
      const canvasText = document.createElement('canvas');
      const ctxText = canvasText.getContext('2d');
      canvasText.width = 128; // Power of 2 for efficiency
      canvasText.height = 128;
      ctxText.font = 'Bold 80px monospace';
      ctxText.fillStyle = '#' + data.color.toString(16).padStart(6, '0');
      ctxText.textAlign = 'center';
      ctxText.textBaseline = 'middle';
      ctxText.fillText(data.text, 64, 64);

      const texture = new THREE.CanvasTexture(canvasText);
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
      const geometry = new THREE.PlaneGeometry(0.8, 0.8);
      const mesh = new THREE.Mesh(geometry, material);

      // Random starting positions (clustered where his head will be)
      mesh.position.set(
        (Math.random() - 0.5) * 0.5,
        0.5 + (Math.random() - 0.5) * 0.5, // Slightly higher
        (Math.random() - 0.5) * 0.5
      );

      // Random rotation speed for each symbol
      mesh.userData.rotationSpeed = {
        x: (Math.random() - 0.5) * 0.05,
        y: (Math.random() - 0.5) * 0.05,
        z: (Math.random() - 0.5) * 0.02
      };

      symbolGroup.add(mesh);
    });

    // Also add jagged electric arcs as LineSegments (basic 3D lines)
    const lightningCount = 5;
    const lightningGroup = new THREE.Group();
    scene.add(lightningGroup);
    
    for (let i = 0; i < lightningCount; i++) {
        const material = new THREE.LineBasicMaterial({ color: 0x3ac1ef, linewidth: 2 });
        const geometry = new THREE.BufferGeometry();
        const positions = [];
        for (let j = 0; j < 6; j++) { positions.push(0, 0, 0); } // Initial points at origin
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        const line = new THREE.Line(geometry, material);
        lightningGroup.add(line);
    }

    /* --- 3. SCROLL INTEGRATION & RENDER LOOP --- */

    let scrollProgress = 0;
    let seed = 0;

    window.addEventListener("scroll", () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollProgress = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
    });

    function animate() {
      // Background Image Update (2D Jitter and Contortion)
      if (memeImg.complete) {
        seed += 0.05;
        turbulence.setAttribute("seed", Math.floor(seed % 10));

        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        const cx = bgCanvas.width / 2;
        const cy = bgCanvas.height / 2;

        const frustration = Math.min(scrollProgress / 0.55, 1);
        const burst = Math.max((scrollProgress - 0.45) / 0.55, 0);

        // Escalating vibration
        const shakeIntensity = frustration * 14;
        const shakeX = frustration > 0.1 ? (Math.random() - 0.5) * shakeIntensity : 0;
        const shakeY = frustration > 0.1 ? (Math.random() - 0.5) * shakeIntensity : 0;

        // Face squeeze contortion
        const scaleX = 1 + frustration * 0.15;
        const scaleY = 1 - frustration * 0.18;

        bgCtx.save();
        bgCtx.translate(cx + shakeX, cy + shakeY);

        if (burst < 0.95) {
          bgCtx.save();
          bgCtx.scale(scaleX, scaleY);
          bgCtx.globalAlpha = Math.max(0, 1 - burst * 1.3); // Fade out
          const imgW = 460;
          const imgH = (memeImg.naturalHeight / memeImg.naturalWidth) * imgW;
          bgCtx.drawImage(memeImg, -imgW / 2, -imgH / 2, imgW, imgH);
          bgCtx.restore();
        }
        bgCtx.restore();
      }

      /* --- 4. 3D SYMBOL ANIMATION DRIVEN BY SCROLL --- */
      const burst = Math.max((scrollProgress - 0.45) / 0.55, 0);

      if (burst > 0.05) {
        symbolGroup.visible = true;
        lightningGroup.visible = true;
        
        symbolGroup.children.forEach((mesh) => {
          // Explode outwards and drift upwards
          // We use burst^2 for non-linear explosion (starts fast, slows down)
          const explodeDistance = (2 + burst * 8); 
          const originalPos = mesh.userData.originalPosition || mesh.position.clone();
          if(!mesh.userData.originalPosition) mesh.userData.originalPosition = originalPos;

          // Push particles out from center (origin)
          const direction = originalPos.clone().normalize();
          mesh.position.addVectors(originalPos, direction.multiplyScalar(explodeDistance * Math.pow(burst, 1.5)));
          mesh.position.y += burst * 3; // Float up

          // Continuously rotate the 3D meshes
          mesh.rotation.x += mesh.userData.rotationSpeed.x;
          mesh.rotation.y += mesh.userData.rotationSpeed.y;
          mesh.rotation.z += mesh.userData.rotationSpeed.z;

          // Fade in based on burst
          mesh.material.opacity = Math.min(burst * 2, 1);
        });

        // 5. 3D Lightning Update
        lightningGroup.children.forEach(line => {
            const positions = line.geometry.attributes.position.array;
            const burstIntensity = burst * 5;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i] = (Math.random() - 0.5) * burstIntensity;     // x
                positions[i+1] = 0.5 + (Math.random() - 0.5) * burstIntensity; // y (starting high)
                positions[i+2] = (Math.random() - 0.5) * burstIntensity;   // z
            }
            line.geometry.attributes.position.needsUpdate = true;
            line.material.opacity = Math.random() > 0.8 ? 1 : 0.2; // flicker
            line.material.transparent = true;
        });

      } else {
        symbolGroup.visible = false;
        lightningGroup.visible = false;
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
