<!DOCTYPE html>
<html lang="en" class="lenis lenis-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Character Animation</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Font for Loader -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">

  <!-- GSAP + ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis Smooth Scroll -->
  <script src="https://unpkg.com/lenis@1.1.9/dist/lenis.min.js"></script>

  <style>
    body {
      background-color: #0b0f14;
      margin: 0;
      overflow-x: hidden;
      font-family: 'Space Mono', monospace;
    }

    #frame-canvas {
      will-change: transform;
      transform: translateZ(0);
    }

    /* Subtle cinematic grain */
    .film-grain {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>

  <div class="film-grain"></div>

  <!-- ==================== FIXED CANVAS CONTAINER ==================== -->
  <div id="canvas-wrapper" class="fixed inset-0 w-full h-full pointer-events-none z-0">
    <div id="hero-loader" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-[#0b0f14] text-xs text-white/50 tracking-widest uppercase">
      <div class="w-10 h-10 rounded-full border border-white/20 border-t-[#d4f038] animate-spin mb-4"></div>
      Loading Sequence...
    </div>
    <canvas id="frame-canvas" class="w-full h-full"></canvas>
  </div>

  <!-- ==================== SCROLL SPACER ==================== -->
  <!-- Adjust height to speed up or slow down scrubbing playback -->
  <section id="character-scroll-track" class="relative w-full h-[360vh] pointer-events-none"></section>

  <!-- ==================== ANIMATION ENGINE ==================== -->
  <script>
    gsap.registerPlugin(ScrollTrigger);

    // 1. Smooth Scroll Engine
    const lenis = new Lenis({
      duration: 1.15,
      easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      orientation: 'vertical',
      smoothWheel: true,
    });
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add((time) => lenis.raf(time * 1000));
    gsap.ticker.lagSmoothing(0);

    // 2. High-DPI 144-Frame Canvas Player
    (function () {
      const FRAME_COUNT = 144;
      const FRAME_PATH = (i) => `images-webp/ezgif-frame-${String(i).padStart(3, '0')}.webp`;

      const canvas = document.getElementById('frame-canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const loader = document.getElementById('hero-loader');

      const images = new Array(FRAME_COUNT);
      let logicalW = window.innerWidth;
      let logicalH = window.innerHeight;
      let currentFrame = 0;
      let isFirstFrameReady = false;

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        logicalW = window.innerWidth;
        logicalH = window.innerHeight;

        canvas.width = Math.round(logicalW * dpr);
        canvas.height = Math.round(logicalH * dpr);
        canvas.style.width = logicalW + 'px';
        canvas.style.height = logicalH + 'px';

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        renderFrame(Math.floor(currentFrame));
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function renderFrame(index) {
        const img = images[index];
        if (!img || !img.complete || img.naturalWidth === 0) return;

        const canvasRatio = logicalW / logicalH;
        const imgRatio = img.naturalWidth / img.naturalHeight;
        let dw, dh, dx, dy;

        // Cover-fit logic preserving aspect ratio
        if (imgRatio > canvasRatio) {
          dh = logicalH;
          dw = dh * imgRatio;
          dx = (logicalW - dw) / 2;
          dy = 0;
        } else {
          dw = logicalW;
          dh = dw / imgRatio;
          dx = 0;
          dy = (logicalH - dh) / 2;
        }

        ctx.clearRect(0, 0, logicalW, logicalH);
        ctx.drawImage(img, dx, dy, dw, dh);
      }

      // Preload the 144 frames
      for (let i = 0; i < FRAME_COUNT; i++) {
        const img = new Image();
        img.src = FRAME_PATH(i + 1);
        img.onload = () => {
          if (!isFirstFrameReady) {
            isFirstFrameReady = true;
            renderFrame(0);
            gsap.to(loader, { opacity: 0, duration: 0.4, onComplete: () => loader.remove() });
          }
        };
        images[i] = img;
      }

      // Scrub the sequence from start to finish
      const sequenceObj = { frame: 0 };
      gsap.to(sequenceObj, {
        frame: FRAME_COUNT - 1,
        ease: 'none',
        scrollTrigger: {
          trigger: '#character-scroll-track',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 0.35,
          onUpdate: () => {
            currentFrame = sequenceObj.frame;
            renderFrame(Math.floor(sequenceObj.frame));
          }
        }
      });
    })();
  </script>
</body>
</html>
