<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pen & Ink Scroll Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f4efe6; /* Parchment ink paper feel */
      font-family: monospace;
      color: #1a1a1a;
      overflow-x: hidden;
    }
    /* Creates scroll distance */
    .scroll-track {
      height: 400vh;
      position: relative;
    }
    /* Keeps the hero element locked in the viewport */
    .sticky-container {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      max-width: 600px;
      height: 600px;
    }
    .hud {
      position: absolute;
      bottom: 2rem;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="scroll-track">
    <div class="sticky-container">
      <canvas id="hero-canvas" width="600" height="600"></canvas>
      <div class="hud">Scroll down to overload</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("hero-canvas");
    const ctx = canvas.getContext("2d");

    let scrollProgress = 0;
    const symbols = ["∑", "√", "π", "∫", "0", "1", "%", "≠", "{ }", "∂", "∞", "λ"];
    const particles = [];

    // Initialize exploded particles
    for (let i = 0; i < 45; i++) {
      particles.push({
        char: symbols[Math.floor(Math.random() * symbols.length)],
        angle: Math.random() * Math.PI * 2,
        dist: 30 + Math.random() * 220,
        speed: 0.5 + Math.random() * 1.5,
        size: 14 + Math.random() * 18
      });
    }

    // Track scroll depth normalized (0.0 to 1.0)
    window.addEventListener("scroll", () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollProgress = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
    });

    // Ink hand-drawn jitter function
    function jitter(val, amount = 1.5) {
      return val + (Math.random() - 0.5) * amount;
    }

    // Procedural jagged lightning line
    function drawLightning(x1, y1, x2, y2, segments = 5) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      for (let i = 1; i < segments; i++) {
        const t = i / segments;
        const nx = x1 + (x2 - x1) * t + (Math.random() - 0.5) * 20;
        const ny = y1 + (y2 - y1) * t + (Math.random() - 0.5) * 20;
        ctx.lineTo(nx, ny);
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = 300;
      const cy = 300;

      // Stage thresholds
      // 0.0 - 0.5: Frustration / Contortion
      // 0.5 - 1.0: Overload / Electric Explosion
      const frustration = Math.min(scrollProgress / 0.5, 1);
      const explosion = Math.max((scrollProgress - 0.45) / 0.55, 0);

      // Frustration head vibration
      const shakeX = frustration > 0.4 ? (Math.random() - 0.5) * (frustration * 10) : 0;
      const shakeY = frustration > 0.4 ? (Math.random() - 0.5) * (frustration * 10) : 0;

      ctx.save();
      ctx.translate(cx + shakeX, cy + shakeY);
      ctx.strokeStyle = "#111";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.fillStyle = "#111";

      // 1. HEAD BASE
      if (explosion < 0.7) {
        ctx.beginPath();
        const headScale = 1 - explosion * 0.4;
        ctx.ellipse(
          jitter(0),
          jitter(0),
          jitter(75 * headScale),
          jitter(95 * headScale),
          0,
          0,
          Math.PI * 2
        );
        ctx.stroke();

        // Cross-hatching shading (frustration tension)
        if (frustration > 0.2) {
          ctx.lineWidth = 1;
          const lines = Math.floor(frustration * 12);
          for (let i = 0; i < lines; i++) {
            ctx.beginPath();
            ctx.moveTo(jitter(-40 + i * 5), jitter(-70));
            ctx.lineTo(jitter(-25 + i * 5), jitter(-50));
            ctx.stroke();
          }
          ctx.lineWidth = 2.5;
        }

        // 2. CONTORTING EYES & EYEBROWS
        const browDrop = frustration * 12;
        const eyeSquint = frustration * 4;

        // Eyebrows (slanted down into an angry/frustrated V-shape)
        ctx.beginPath();
        ctx.moveTo(jitter(-45), jitter(-25 + browDrop));
        ctx.lineTo(jitter(-10), jitter(-15 + browDrop * 1.8));
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(jitter(45), jitter(-25 + browDrop));
        ctx.lineTo(jitter(10), jitter(-15 + browDrop * 1.8));
        ctx.stroke();

        // Pupils
        ctx.beginPath();
        ctx.arc(jitter(-25), jitter(-5), Math.max(1, 5 - eyeSquint), 0, Math.PI * 2);
        ctx.arc(jitter(25), jitter(-5), Math.max(1, 5 - eyeSquint), 0, Math.PI * 2);
        ctx.fill();

        // 3. MOUTH (from neutral line to grimace / open scream)
        ctx.beginPath();
        const mouthOpen = frustration * 22;
        ctx.ellipse(jitter(0), jitter(45), jitter(20 + frustration * 10), jitter(2 + mouthOpen), 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 4. ELECTRICITY & SYMBOLS EXPLOSION
      if (explosion > 0.05) {
        // Jagged electricity bolts
        ctx.lineWidth = 1.8;
        const boltCount = Math.floor(explosion * 8);
        for (let i = 0; i < boltCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r1 = 30;
          const r2 = 90 + explosion * 90;
          drawLightning(
            Math.cos(angle) * r1,
            Math.sin(angle) * r1,
            Math.cos(angle) * r2,
            Math.sin(angle) * r2
          );
        }

        // Floating / expanding numbers and equations
        ctx.font = "bold 18px monospace";
        particles.forEach((p) => {
          const currentDist = p.dist * explosion * p.speed;
          const px = Math.cos(p.angle) * currentDist;
          const py = Math.sin(p.angle) * currentDist - explosion * 30; // rising drift
          ctx.save();
          ctx.translate(jitter(px, 2), jitter(py, 2));
          ctx.globalAlpha = Math.min(explosion * 1.5, 1);
          ctx.fillText(p.char, 0, 0);
          ctx.restore();
        });
      }

      ctx.restore();
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
