<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll-Driven Video Animation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Track that creates the scrolling room */
    .scroll-track {
      height: 400vh; /* Adjust height to make the scrub faster or slower */
      position: relative;
    }

    /* Sticky container keeping the video centered while scrolling */
    .sticky-container {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      max-width: 1000px;
      height: auto;
      object-fit: contain;
      pointer-events: none;
    }

    /* Spacer for content after the animation finishes */
    .next-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      color: #0f172a;
      font-size: 2rem;
      font-weight: 700;
    }
  </style>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>

  <!-- Scroll-pinned video section -->
  <div class="scroll-track">
    <div class="sticky-container">
      <video id="hero-video" playsinline webkit-playsinline muted preload="auto">
        <source src="Hero-Video-original.Mp4.mp4" type="video/mp4" />
      </video>
    </div>
  </div>

  <!-- Content that appears after scrolling through the video -->
  <section class="next-section">
    <p>Let me take the chaos off your plate.</p>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const video = document.getElementById("hero-video");

    // Ensure video metadata is loaded before attaching scroll scrub
    video.addEventListener("loadedmetadata", initScroll);

    function initScroll() {
      gsap.to(video, {
        currentTime: video.duration,
        ease: "none",
        scrollTrigger: {
          trigger: ".scroll-track",
          start: "top top",
          end: "bottom bottom",
          scrub: 0.1, // Smooth dampening delay
        }
      });
    }

    // Fallback for browsers that already cached/loaded the video
    if (video.readyState >= 1) {
      initScroll();
    }
  </script>
</body>
</html>
