<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growth Partner | Interactive Portfolio</title>
  
  <!-- GSAP & ScrollTrigger CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --qb-green: #2CA01C;
      --qb-dark: #0d1117;
      --qb-card: #161b22;
      --qb-gray: #9ca3af;
      --text-white: #ffffff;
    }

    body {
      background-color: var(--qb-dark);
      color: var(--text-white);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Preloader */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--qb-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      z-index: 999;
      transition: opacity 0.5s ease;
    }

    #loader .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(44, 160, 28, 0.2);
      border-top-color: var(--qb-green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      z-index: 50;
      background: linear-gradient(to bottom, rgba(13, 17, 23, 0.9), transparent);
    }

    .logo {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .logo span {
      color: var(--qb-green);
    }

    .nav-links a {
      color: var(--qb-gray);
      text-decoration: none;
      margin-left: 2rem;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    /* Sticky Video Scrubbing Section */
    .scroll-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(44, 160, 28, 0.08) 0%, transparent 70%);
    }

    #sequence-canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      color: var(--qb-gray);
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
      60% { transform: translateY(-4px); }
    }

    /* Interactive Scatter Typography Section */
    .scatter-section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 4rem 2rem;
      background: radial-gradient(circle at center, rgba(44, 160, 28, 0.15) 0%, transparent 60%);
    }

    .scatter-header {
      color: var(--qb-green);
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 2px;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    #scatter-canvas {
      cursor: crosshair;
      max-width: 100%;
    }

    .cta-btn {
      margin-top: 2rem;
      padding: 1rem 2rem;
      background-color: var(--qb-green);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(44, 160, 28, 0.3);
    }
  </style>
</head>
<body>

  <!-- Preloader -->
  <div id="loader">
    <div class="spinner"></div>
    <p>Preparing Experience... <span id="progress">0%</span></p>
  </div>

  <!-- Navigation -->
  <nav>
    <div class="logo">Operations<span>Partner</span></div>
    <div class="nav-links">
      <a href="#hero">Home</a>
      <a href="#problem">The Problem</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <!-- Section 1: Scroll-Driven Video Frame Sequence -->
  <section class="scroll-container" id="hero">
    <canvas id="sequence-canvas"></canvas>
    <div class="scroll-hint">Scroll down to scrub</div>
  </section>

  <!-- Section 2: Interactive QuickBooks Typography Scatter -->
  <section class="scatter-section" id="problem">
    <span class="scatter-header">Hover Over the Text</span>
    <canvas id="scatter-canvas"></canvas>
    <a href="#contact" class="cta-btn">Hand Over Your Books</a>
  </section>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    /* ==========================================================
       1. SCROLL-DRIVEN SEQUENCE SETUP
       ========================================================== */
    const frameCanvas = document.getElementById("sequence-canvas");
    const frameCtx = frameCanvas.getContext("2d");
    const loader = document.getElementById("loader");
    const progressText = document.getElementById("progress");

    const frameCount = 60; // Set to your frame count (e.g. 240)
    const images = [];
    const sequence = { frame: 0 };
    let loadedCount = 0;

    frameCanvas.width = 1920;
    frameCanvas.height = 1080;

    // Helper: returns your frame path (or renders programmatic fallbacks)
    function getFrameSource(i) {
      // UNCOMMENT this line when you add your real frames:
      // return `./frames/frame_${(i + 1).toString().padStart(3, "0")}.jpg`;

      // DEMO FALLBACK: Generates dummy frames automatically for test run
      const dummy = document.createElement("canvas");
      dummy.width = 1920;
      dummy.height = 1080;
      const dCtx = dummy.getContext("2d");
      dCtx.fillStyle = "#0d1117";
      dCtx.fillRect(0, 0, dummy.width, dummy.height);
      dCtx.fillStyle = "#2CA01C";
      dCtx.font = "bold 64px sans-serif";
      dCtx.textAlign = "center";
      dCtx.fillText(`Frame ${(i + 1).toString().padStart(3, "0")}`, 960, 540);
      return dummy.toDataURL();
    }

    function renderSequenceFrame(img) {
      if (!img) return;
      frameCtx.clearRect(0, 0, frameCanvas.width, frameCanvas.height);

      const hRatio = frameCanvas.width / img.naturalWidth;
      const vRatio = frameCanvas.height / img.naturalHeight;
      const ratio = Math.min(hRatio, vRatio);

      const shiftX = (frameCanvas.width - img.naturalWidth * ratio) / 2;
      const shiftY = (frameCanvas.height - img.naturalHeight * ratio) / 2;

      frameCtx.drawImage(
        img,
        0, 0, img.naturalWidth, img.naturalHeight,
        shiftX, shiftY, img.naturalWidth * ratio, img.naturalHeight * ratio
      );
    }

    // Preloader loop
    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = getFrameSource(i);
      img.onload = () => {
        loadedCount++;
        progressText.textContent = `${Math.round((loadedCount / frameCount) * 100)}%`;

        if (loadedCount === frameCount) {
          loader.style.opacity = "0";
          setTimeout(() => loader.remove(), 500);
          initScrollSequence();
        }
      };
      images.push(img);
    }

    function initScrollSequence() {
      renderSequenceFrame(images[0]);

      gsap.to(sequence, {
        frame: frameCount - 1,
        snap: "frame",
        ease: "none",
        scrollTrigger: {
          trigger: ".scroll-container",
          start: "top top",
          end: "+=3000",
          pin: true,
          scrub: 0.5,
        },
        onUpdate: () => {
          renderSequenceFrame(images[sequence.frame]);
        },
      });
    }

    /* ==========================================================
       2. INTERACTIVE SCATTER TEXT ENGINE
       ========================================================== */
    const textCanvas = document.getElementById("scatter-canvas");
    const tCtx = textCanvas.getContext("2d");

    const rawText = "Drowning in receipts. Chasing unpaid invoices. Wondering where your money went. Growing back pain instead of your business? It might be time to hand your books to a bookkeeper.";
    
    let particles = [];
    const mouse = { x: -1000, y: -1000, radius: 120 };

    function initScatterText() {
      const maxWidth = Math.min(900, window.innerWidth - 60);
      textCanvas.width = maxWidth;
      textCanvas.height = 420;

      tCtx.font = "bold 28px -apple-system, sans-serif";
      tCtx.textAlign = "left";
      tCtx.textBaseline = "top";

      // Word-wrap calculator to find base letter coordinates
      const words = rawText.split(" ");
      let line = "";
      let x = 0;
      let y = 30;
      const lineHeight = 46;
      particles = [];

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + " ";
        const metrics = tCtx.measureText(testLine);

        if (metrics.width > maxWidth && n > 0) {
          positionLineGlyphs(line, y);
          line = words[n] + " ";
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      positionLineGlyphs(line, y);
    }

    function positionLineGlyphs(lineStr, lineY) {
      let currentX = 0;
      for (let i = 0; i < lineStr.length; i++) {
        const char = lineStr[i];
        const width = tCtx.measureText(char).width;

        if (char !== " ") {
          particles.push({
            char: char,
            originX: currentX,
            originY: lineY,
            x: currentX,
            y: lineY,
            vx: 0,
            vy: 0,
            angle: 0,
            // Highlight specific words in QuickBooks Green
            isAccent: ["receipts.", "invoices.", "bookkeeper."].some(w => lineStr.includes(w) && w.includes(char))
          });
        }
        currentX += width;
      }
    }

    // Physics Animation Loop
    function animateScatter() {
      tCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
      tCtx.font = "bold 28px -apple-system, sans-serif";

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];

        const dx = mouse.x - p.x;
        const dy = mouse.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        // Repulsion physics
        if (dist < mouse.radius) {
          const angle = Math.atan2(dy, dx);
          const force = (mouse.radius - dist) / mouse.radius;
          p.vx -= Math.cos(angle) * force * 7;
          p.vy -= Math.sin(angle) * force * 7;
          p.angle = (p.vx * 0.05);
        }

        // Spring return to origin
        const homeDx = p.originX - p.x;
        const homeDy = p.originY - p.y;
        p.vx += homeDx * 0.08;
        p.vy += homeDy * 0.08;

        // Friction / damping
        p.vx *= 0.82;
        p.vy *= 0.82;
        p.angle *= 0.85;

        p.x += p.vx;
        p.y += p.vy;

        // Draw character
        tCtx.save();
        tCtx.translate(p.x, p.y);
        tCtx.rotate(p.angle);
        tCtx.fillStyle = p.isAccent ? "#2CA01C" : "#ffffff";
        tCtx.fillText(p.char, 0, 0);
        tCtx.restore();
      }

      requestAnimationFrame(animateScatter);
    }

    // Mouse tracker relative to canvas
    textCanvas.addEventListener("mousemove", (e) => {
      const rect = textCanvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    textCanvas.addEventListener("mouseleave", () => {
      mouse.x = -1000;
      mouse.y = -1000;
    });

    window.addEventListener("resize", initScatterText);

    // Run scatter init
    initScatterText();
    animateScatter();
  </script>
</body>
</html>
