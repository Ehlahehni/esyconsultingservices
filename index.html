<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Hero Overload</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #faf7f2;
      color: #111;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    /* Long track to allow scrolling */
    .scroll-container {
      height: 350vh;
      position: relative;
    }

    /* Locks the animation inside the viewport */
    .hero-viewport {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      max-width: 650px;
      height: auto;
      aspect-ratio: 1 / 1;
      filter: url(#ink-boil); /* Real-time hand-drawn line jitter */
    }

    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      font-weight: 600;
      color: #555;
    }
  </style>
</head>
<body>

  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
    <filter id="ink-boil">
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="scroll-container">
    <div class="hero-viewport">
      <canvas id="stage" width="700" height="700"></canvas>
      <div class="scroll-hint">Scroll down to overload</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const turbulence = document.getElementById("turbulence");

    // Load your transparent Jackie Chan meme cutout
    const memeImg = new Image();
    memeImg.src = "Snipaste_2026-09-04_03-21-35.png";

    let scrollProgress = 0;
    let seed = 0;

    // Symbol pool for the explosion
    const chars = ["∑", "√", "π", "∫", "0", "1", "%", "≠", "{ }", "∂", "∞", "λ", "404", "NaN"];
    const particles = [];
    for (let i = 0; i < 50; i++) {
      particles.push({
        text: chars[Math.floor(Math.random() * chars.length)],
        angle: Math.random() * Math.PI * 2,
        dist: 40 + Math.random() * 260,
        speed: 0.7 + Math.random() * 1.3,
        size: 14 + Math.random() * 18
      });
    }

    // Scroll normalization (0.0 to 1.0)
    window.addEventListener("scroll", () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollProgress = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
    });

    // Draw jagged electric arcs
    function drawLightning(x1, y1, x2, y2, segments = 5) {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      for (let i = 1; i < segments; i++) {
        const t = i / segments;
        const nx = x1 + (x2 - x1) * t + (Math.random() - 0.5) * 24;
        const ny = y1 + (y2 - y1) * t + (Math.random() - 0.5) * 24;
        ctx.lineTo(nx, ny);
      }
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }

    function loop() {
      // 1. Animate line-boil filter periodically
      seed += 0.05;
      turbulence.setAttribute("seed", Math.floor(seed % 10));

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // Phase boundaries:
      // 0.0 - 0.55: Escalating frustration & face contortion
      // 0.45 - 1.0: Head burst, electricity & symbol scatter
      const frustration = Math.min(scrollProgress / 0.55, 1);
      const burst = Math.max((scrollProgress - 0.45) / 0.55, 0);

      // Increasing head vibration
      const shakeIntensity = frustration * 14;
      const shakeX = frustration > 0.1 ? (Math.random() - 0.5) * shakeIntensity : 0;
      const shakeY = frustration > 0.1 ? (Math.random() - 0.5) * shakeIntensity : 0;

      // Squish/squeeze contortion as frustration mounts
      const scaleX = 1 + frustration * 0.15;
      const scaleY = 1 - frustration * 0.18;

      ctx.save();
      ctx.translate(cx + shakeX, cy + shakeY);

      // Draw the meme head if not fully dispersed
      if (burst < 0.95 && memeImg.complete) {
        ctx.save();
        ctx.scale(scaleX, scaleY);
        ctx.globalAlpha = Math.max(0, 1 - burst * 1.3);

        const imgW = 460;
        const imgH = (memeImg.naturalHeight / memeImg.naturalWidth) * imgW;
        ctx.drawImage(memeImg, -imgW / 2, -imgH / 2, imgW, imgH);
        ctx.restore();
      }

      // 2. Draw jagged electrical bolts
      if (burst > 0.05) {
        ctx.strokeStyle = "#111";
        ctx.lineWidth = 2.2;
        ctx.lineCap = "round";

        const boltCount = Math.floor(burst * 10);
        for (let i = 0; i < boltCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r1 = 30;
          const r2 = 120 + burst * 160;
          drawLightning(
            Math.cos(angle) * r1,
            Math.sin(angle) * r1 - 40,
            Math.cos(angle) * r2,
            Math.sin(angle) * r2 - 40
          );
        }

        // 3. Exploding symbols & numbers
        ctx.fillStyle = "#111";
        ctx.font = "bold 20px monospace";

        particles.forEach((p) => {
          const currentDist = p.dist * burst * p.speed;
          const px = Math.cos(p.angle) * currentDist;
          const py = Math.sin(p.angle) * currentDist - burst * 60; // upward drift

          ctx.save();
          ctx.translate(px, py);
          ctx.globalAlpha = Math.min(burst * 1.6, 1);
          ctx.fillText(p.text, 0, 0);
          ctx.restore();
        });
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    memeImg.onload = () => requestAnimationFrame(loop);
    if (memeImg.complete) requestAnimationFrame(loop);
  </script>
</body>
</html>
